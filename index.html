<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LY JING MART</title>
<style>
:root{--pink:#ff4f93;--light:#fff0f6}
*{box-sizing:border-box}body{margin:0;background:#fafafa;font-family:Arial,sans-serif;color:#222;padding-bottom:75px}
.top{background:#fff;padding:14px 15px;position:sticky;top:0;z-index:5;border-bottom:1px solid #eee}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:45px;height:45px;border-radius:50%;object-fit:cover}.brand strong{font-size:20px;flex:1}.cart{font-size:24px;position:relative}.badge{position:absolute;right:-7px;top:-7px;background:var(--pink);color:#fff;border-radius:50%;font-size:11px;min-width:19px;text-align:center;padding:3px}
.search{margin-top:12px;background:#f3f3f5;border-radius:13px;padding:11px 13px;display:flex;gap:8px}.search input{border:0;outline:0;background:none;width:100%;font-size:14px}
main{padding:14px}.banner{height:155px;border-radius:18px;background:linear-gradient(135deg,#ff4f93,#ff9fc2);color:#fff;padding:25px 20px}.banner h1{margin:0;font-size:27px}.banner p{font-size:14px}.banner button{border:0;border-radius:20px;padding:9px 16px;color:var(--pink);font-weight:bold}
h2{font-size:18px;margin:22px 0 12px}.cats{display:flex;gap:14px;overflow:auto}.cat{min-width:70px;text-align:center;font-size:11px}.cat div{width:62px;height:62px;margin:auto;border-radius:50%;background:var(--light);display:flex;align-items:center;justify-content:center;font-size:28px}.cat span{display:block;margin-top:6px}
.head{display:flex;align-items:center;justify-content:space-between}.head h2{margin-bottom:12px}.head a{font-size:12px;color:var(--pink)}
.products{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#fff;border-radius:15px;padding:9px;box-shadow:0 2px 10px #0000000d}.photo{height:145px;border-radius:12px;background:#f7f7f7;display:flex;align-items:center;justify-content:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:contain}.emoji{font-size:52px}.name{font-size:14px;font-weight:bold;margin-top:9px}.price{color:var(--pink);font-weight:800;margin-top:4px}.stock{font-size:11px;color:#888;margin-top:3px}.add{width:100%;border:0;background:var(--pink);color:#fff;border-radius:10px;padding:9px;margin-top:8px;font-weight:bold}
.bottom{position:fixed;bottom:0;left:0;right:0;height:65px;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;z-index:10}.nav{border:0;background:none;color:#777;font-size:10px}.nav b{display:block;font-size:20px;margin:8px 0 2px}.active{color:var(--pink)}
</style>
</head>
<body>
<header class="top">
<div class="brand"><img src="logo.png" onerror="this.style.display='none'"><strong>LY JING MART</strong><div class="cart">🛒<span class="badge" id="count">0</span></div></div>
<div class="search">🔎<input id="search" placeholder="Search products..."></div>
</header>
<main>
<section class="banner"><h1>Shop Smart. Shop LY JING.</h1><p>Fresh products, great prices and easy shopping.</p><button>Shop Now</button></section>
<div class="head"><h2>Popular Categories</h2><a>View all</a></div>
<div class="cats">
<div class="cat"><div>🍜</div><span>Food</span></div><div class="cat"><div>🥤</div><span>Drinks</span></div><div class="cat"><div>🍿</div><span>Snacks</span></div><div class="cat"><div>🧴</div><span>Personal Care</span></div><div class="cat"><div>🏠</div><span>Home</span></div><div class="cat"><div>👶</div><span>Baby</span></div>
</div>
<div class="head"><h2>🔥 Top Deals</h2><a>View all</a></div><div class="products" id="products"></div>
<div class="head"><h2>⭐ Featured Products</h2><a>View all</a></div><div class="products" id="featured"></div>
</main>
<nav class="bottom"><button class="nav active"><b>⌂</b>Home</button><button class="nav"><b>▦</b>Categories</button><button class="nav"><b>🛒</b>Cart</button><button class="nav"><b>🎁</b>Promotion</button><button class="nav"><b>👤</b>My Orders</button></nav>
<script>
const products=[
{id:1,name:"MAMA Noodle",price:1,cat:"Food",img:"mama.png",e:"🍜",stock:20},
{id:2,name:"Indomie Noodles 80g",price:.85,cat:"Food",img:"indomie.png",e:"🍜",stock:20},
{id:3,name:"Lay's Chips 50g",price:1,cat:"Snacks",img:"lays.png",e:"🥔",stock:15},
{id:4,name:"Coca Cola 1.25L",price:1.2,cat:"Drinks",img:"coke.png",e:"🥤",stock:15},
{id:5,name:"Colgate",price:2.5,cat:"Personal Care",img:"colgate.png",e:"🪥",stock:10},
{id:6,name:"Drinking Water",price:.5,cat:"Drinks",img:"water.png",e:"💧",stock:30}];
let cart=JSON.parse(localStorage.getItem("lyjing_cart")||"[]");
function card(p){return `<div class="card"><div class="photo"><img src="${p.img}" onerror="this.outerHTML='<div class=emoji>${p.e}</div>'"></div><div class="name">${p.name}</div><div class="price">$${p.price.toFixed(2)}</div><div class="stock">${p.stock} in stock</div><button class="add" onclick="add(${p.id})">Add to Cart</button></div>`}
function render(a=products){productsBox.innerHTML=a.map(card).join("");featured.innerHTML=a.slice(0,4).map(card).join("")}
function add(id){let p=products.find(x=>x.id===id),x=cart.find(x=>x.id===id);x?x.qty++:cart.push({id:p.id,name:p.name,price:p.price,qty:1});localStorage.setItem("lyjing_cart",JSON.stringify(cart));count.textContent=cart.reduce((s,x)=>s+x.qty,0)}
const productsBox=document.getElementById("products"),featured=document.getElementById("featured"),count=document.getElementById("count");
document.getElementById("search").oninput=e=>{let q=e.target.value.toLowerCase();render(products.filter(p=>(p.name+" "+p.cat).toLowerCase().includes(q)))};
render();count.textContent=cart.reduce((s,x)=>s+x.qty,0);
</script>
</body></html>
